name: Deploy Frontend to Cloud Run

on:
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci-frontend:
    name: Frontend - Typecheck & Build (required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: Typecheck (required)
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Build (required)
        working-directory: apps/frontend
        run: npm run build

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [ci-frontend]

    # ✅ dev => staging auto / main => prod protégé
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1065072984498/locations/global/workloadIdentityPools/github-pool/providers/github-actions-prod
          service_account: cloud-run-deployer@artisan-pro-prod.iam.gserviceaccount.com

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & push frontend image
        run: |
          IMAGE_NAME="${{ github.ref_name == 'main' && 'artisan-pro-frontend' || 'artisan-pro-frontend-staging' }}"
          IMAGE_URI="europe-west1-docker.pkg.dev/artisan-pro-prod/cloud-run/${IMAGE_NAME}"

          echo "Building image: ${IMAGE_URI}"
          gcloud builds submit ./apps/frontend --tag "${IMAGE_URI}"

      - name: Deploy frontend to Cloud Run
        run: |
          SERVICE_NAME="${{ github.ref_name == 'main' && 'artisan-pro-frontend' || 'artisan-pro-frontend-staging' }}"
          IMAGE_NAME="${{ github.ref_name == 'main' && 'artisan-pro-frontend' || 'artisan-pro-frontend-staging' }}"
          IMAGE_URI="europe-west1-docker.pkg.dev/artisan-pro-prod/cloud-run/${IMAGE_NAME}"

          echo "Deploying service: ${SERVICE_NAME}"
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE_URI}" \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated