name: Deploy Backend to Cloud Run

on:
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci-backend:
    name: Backend - Typecheck & Build (required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install deps
        working-directory: apps/backend
        run: npm ci

      - name: Typecheck (required)
        working-directory: apps/backend
        run: npm run typecheck

      - name: Build (required)
        working-directory: apps/backend
        run: npm run build

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [ci-backend]

    # ✅ dev => staging (auto), main => production (protégé)
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1065072984498/locations/global/workloadIdentityPools/github-pool/providers/github-actions-prod
          service_account: cloud-run-deployer@artisan-pro-prod.iam.gserviceaccount.com

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 468.0.0"

      - name: Deploy to Cloud Run (source)
        run: |
          SERVICE_NAME="${{ github.ref_name == 'main' && 'artisan-pro-backend' || 'artisan-pro-backend-staging' }}"
          echo "Deploying backend to: ${SERVICE_NAME}"

          gcloud run deploy "${SERVICE_NAME}" \
            --source=./apps/backend \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --build-service-account=1065072984498@cloudbuild.gserviceaccount.com